spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:${PORT:8080}}
spring.application.name=CTI_SENAI
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cti_provedor}
spring.datasource.username=${DB_USER:${DB_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
server.error.include-message=never
server.error.include-stacktrace=never
