services:
  - type: web
    name: cti-insights-etl
    runtime: python
    region: oregon
    plan: free
    rootDir: analytics-python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /saude
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DB_HOST
        value: dpg-dc439sh7lnhs73f9flo0-a
      - key: DB_NAME
        fromDatabase:
          name: bancoRender
          property: database
      - key: DB_USER
        fromDatabase:
          name: bancoRender
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: bancoRender
          property: password
      - key: DB_SSLMODE
        value: require
      - key: ETL_API_KEY
        generateValue: true

  - type: web
    name: cti-insights-api
    runtime: docker
    region: oregon
    plan: free
    rootDir: BackEnd
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DB_URL
        value: jdbc:postgresql://dpg-dc439sh7lnhs73f9flo0-a:5432/bancorender_3cr0?sslmode=require
      - key: DB_USER
        fromDatabase:
          name: bancoRender
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: bancoRender
          property: password
      - key: JWT_SECRET_BASE64
        generateValue: true
      - key: ETL_BASE_URL
        fromService:
          name: cti-insights-etl
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ETL_API_KEY
        fromService:
          name: cti-insights-etl
          type: web
          envVarKey: ETL_API_KEY
      - key: CORS_ALLOWED_ORIGINS
        sync: false
