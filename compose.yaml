services:
  python:
    build:
      context: .
      dockerfile: deploy/Dockerfile.python
    env_file: analytics-python/.env
    environment:
      PORT: "8000"
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    env_file: BackEnd/.env
    environment:
      SERVER_PORT: "8080"
      ETL_URL: http://python:8000/etl
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?Configure JWT_SECRET_BASE64 em .env.deploy}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8088}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
    depends_on:
      - python
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
      args:
        VITE_API_URL: /
    ports:
      - "${FRONTEND_PORT:-8088}:80"
    depends_on:
      - backend
    restart: unless-stopped
